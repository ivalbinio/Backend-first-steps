<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Value Creation Slides Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      padding: 30px 0;
      border-bottom: 1px solid #2a2a2a;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 200px);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
    }

    .message {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .message.assistant .avatar {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }

    .message.user .avatar {
      background: #2a2a2a;
      color: #888;
    }

    .message-content {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 12px;
      line-height: 1.6;
    }

    .message.assistant .message-content {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
    }

    .message.user .message-content {
      background: #2563eb;
      color: white;
    }

    .message-content h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }

    .message-content p {
      margin-bottom: 10px;
    }

    .message-content ul, .message-content ol {
      margin-left: 20px;
      margin-bottom: 10px;
    }

    .message-content li {
      margin-bottom: 6px;
    }

    .message-content code {
      background: #2a2a2a;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 13px;
    }

    .message-content pre {
      background: #0a0a0a;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 12px 0;
    }

    .message-content pre code {
      background: none;
      padding: 0;
    }

    .options-grid {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .option-btn {
      background: #1a1a1a;
      border: 1px solid #3a3a3a;
      padding: 12px 16px;
      border-radius: 8px;
      color: #e0e0e0;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }

    .option-btn:hover {
      background: #2a2a2a;
      border-color: #4a4a4a;
    }

    .option-btn.selected {
      background: #1e3a5f;
      border-color: #2563eb;
    }

    .input-area {
      padding: 20px 0;
      border-top: 1px solid #2a2a2a;
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
    }

    .input-wrapper textarea {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      padding: 14px 18px;
      color: #e0e0e0;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      min-height: 50px;
      max-height: 150px;
    }

    .input-wrapper textarea:focus {
      outline: none;
      border-color: #2563eb;
    }

    .input-wrapper button {
      background: #2563eb;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-wrapper button:hover {
      background: #1d4ed8;
    }

    .input-wrapper button:disabled {
      background: #3a3a3a;
      cursor: not-allowed;
    }

    .phase-indicator {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .phase {
      padding: 6px 12px;
      background: #1a1a1a;
      border-radius: 20px;
      font-size: 12px;
      color: #888;
    }

    .phase.active {
      background: #1e3a5f;
      color: #60a5fa;
    }

    .phase.complete {
      background: #14532d;
      color: #4ade80;
    }

    .table-preview {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 13px;
      table-layout: fixed;
    }

    .table-preview th,
    .table-preview td {
      border: 1px solid #3a3a3a;
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
      word-wrap: break-word;
    }

    .table-preview th:nth-child(1),
    .table-preview td:nth-child(1) {
      width: 15%;
    }

    .table-preview th:nth-child(2),
    .table-preview td:nth-child(2) {
      width: 22%;
    }

    .table-preview th:nth-child(3),
    .table-preview td:nth-child(3) {
      width: 23%;
    }

    .table-preview th:nth-child(4),
    .table-preview td:nth-child(4) {
      width: 40%;
    }

    .table-preview th {
      background: #2b2b35;
      color: #fff;
      font-weight: 600;
    }

    .table-preview tr:nth-child(even) {
      background: #151515;
    }

    .checkmark {
      color: #4ade80;
      margin-right: 4px;
    }

    .editable-cell {
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }

    .editable-cell:hover {
      background: rgba(37, 99, 235, 0.15);
    }

    .editable-cell .edit-icon {
      opacity: 0;
      font-size: 11px;
      margin-left: 6px;
      transition: opacity 0.2s;
    }

    .editable-cell:hover .edit-icon {
      opacity: 1;
    }

    .edn-output {
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
      max-height: 300px;
      overflow: auto;
    }

    .copy-btn {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      padding: 8px 16px;
      border-radius: 6px;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 13px;
      margin-top: 8px;
    }

    .copy-btn:hover {
      background: #3a3a3a;
    }

    .workflow-selector {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 8px;
      margin: 12px 0;
    }

    .workflow-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #1a1a1a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .workflow-item:hover {
      background: #2a2a2a;
    }

    .workflow-item.selected {
      background: #1e3a5f;
      border-color: #2563eb;
    }

    .workflow-item input {
      accent-color: #2563eb;
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #888;
    }

    .loading-dot {
      width: 8px;
      height: 8px;
      background: #888;
      border-radius: 50%;
      animation: pulse 1.4s infinite;
    }

    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .char-count {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }

    .char-count.warning {
      color: #f59e0b;
    }

    .char-count.error {
      color: #ef4444;
    }

    .char-count.too-short {
      color: #f59e0b;
    }

    .char-count.good {
      color: #4ade80;
    }

    .bullet-hint {
      font-size: 10px;
      color: #666;
      font-style: italic;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AI Value Creation Slides Generator</h1>
      <p class="subtitle">Generate Pitch.com slides for AI workflow presentations</p>
    </header>

    <div class="phase-indicator">
      <span class="phase active" id="phase-1">1. Context</span>
      <span class="phase" id="phase-2">2. Heatmap</span>
      <span class="phase" id="phase-3">3. Selection</span>
      <span class="phase" id="phase-4">4. Angle Cards</span>
      <span class="phase" id="phase-5">5. Export</span>
    </div>

    <div class="chat-container">
      <div class="messages" id="messages"></div>

      <div class="input-area">
        <div class="input-wrapper">
          <textarea id="user-input" placeholder="Type your response..." rows="1"></textarea>
          <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="examples.js"></script>
  <script>
    // ==========================================================================
    // EDN TEMPLATE FUNCTIONS
    // ==========================================================================

    // Canonical EDN templates - loaded from prompts/templates/
    const canonicalTemplates = {
      heatmap_pnl: null,
      heatmap_pnl_simple: null,
      angle_cards_double: null,
      angle_cards_triple: null
    };

    // Load canonical templates on page load
    async function loadCanonicalTemplates() {
      const templateFiles = {
        heatmap_pnl: 'prompts/templates/heatmap_pnl_canonical.edn',
        heatmap_pnl_simple: 'prompts/templates/heatmap_pnl_simple_canonical.edn',
        angle_cards_double: 'prompts/templates/angle_cards_double_canonical.edn',
        angle_cards_triple: 'prompts/templates/angle_cards_triple_canonical.edn'
      };

      for (const [key, path] of Object.entries(templateFiles)) {
        try {
          const response = await fetch(path);
          if (response.ok) {
            canonicalTemplates[key] = await response.text();
            console.log(`Loaded canonical template: ${key}`);
          } else {
            console.error(`Failed to load ${path}: ${response.status}`);
          }
        } catch (err) {
          console.error(`Error loading ${path}:`, err);
        }
      }
    }

    // Get the base heatmap EDN template (canonical version with "on call" mention)
    function getHeatmapEdnTemplate() {
      if (canonicalTemplates.heatmap_pnl) {
        return canonicalTemplates.heatmap_pnl;
      }
      console.error('Canonical heatmap_pnl template not loaded');
      return '';
    }

    // Get simple heatmap EDN template (no "on call" mention)
    function getHeatmapSimpleEdnTemplate() {
      if (canonicalTemplates.heatmap_pnl_simple) {
        return canonicalTemplates.heatmap_pnl_simple;
      }
      console.error('Canonical heatmap_pnl_simple template not loaded');
      return '';
    }

    // Get angle card EDN template (2 cards with domain headers)
    function getAngleCardEdnTemplate() {
      if (canonicalTemplates.angle_cards_double) {
        return canonicalTemplates.angle_cards_double;
      }
      console.error('Canonical angle_cards_double template not loaded');
      return '';
    }

    // Get triple angle card EDN template (3 cards)
    function getAngleCardTripleEdnTemplate() {
      if (canonicalTemplates.angle_cards_triple) {
        return canonicalTemplates.angle_cards_triple;
      }
      console.error('Canonical angle_cards_triple template not loaded');
      return '';
    }

    // Helper to escape for EDN/HTML
    function esc(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }

    // Generate EDN for heatmap slide
    // CRITICAL: Only replace text content using simple string split/join
    // NEVER modify structure (UUIDs, coords, table-style, layout, etc.)
    function generateHeatmapEdn() {
      const { context, heatmap } = state;
      let edn = getHeatmapEdnTemplate();

      if (!edn) {
        console.error('No heatmap EDN template found');
        return '';
      }

      // Simple text replacements using split/join (preserves structure)

      // 1. Main title (HARD LIMIT: 85 chars)
      const rawTitle = heatmap.selectedTitle || heatmap.title ||
        `${context.industry} P&L impact comes from industrializing finance control and execution`;
      const newTitle = hardTruncate(rawTitle, LIMITS.heatmap.slideTitle.max);
      edn = edn.split('Airline P&amp;L impact comes from industrializing finance control and execution').join(esc(newTitle));

      // 2. Subtitle with industry
      edn = edn.split('AI Value Creation in Finance').join(`AI Value Creation in ${esc(context.industry)}`);

      // 3. Footer - audience name and title
      edn = edn.split('by Luísa Casimiro (VP Financial Planning &amp; Strategy)').join(
        `by ${esc(context.audience.name)} (${esc(context.audience.title)})`
      );

      // 4. Company name in footer - KEEP Augusta Labs branding (don't replace)

      // 5. Replace table cell contents (row by row)
      // Template has these original values - replace with heatmap.rows content
      const templateRows = [
        { domain: 'Planning &amp; Forecasting', workflow: 'PF1. Integrated Rolling Forecast &amp; Ops Signals', pain: 'Forecasts distorted by disruptions &amp; crew costs.', solution: 'Ingest disruption events &amp; crew schedules to update outlooks, reduce error, and restore guidance credibility.' },
        { domain: '', workflow: 'PF2. Driver-Level Forecast Explainability', pain: 'Manual overrides without traceability.', solution: 'Attribute changes to specific drivers (crew, fuel, disruptions) to improve transparency and confidence.' },
        { domain: 'Capital Allocation', workflow: 'CA1. Initiative-Level ROI Tracking', pain: 'Approvals on static cases; no realized tracking.', solution: 'Track realized vs. expected returns to reallocate capital from underperformers and protect ROIC.' },
        { domain: '', workflow: 'CA2. Fleet &amp; Network Scenario Stress-Testing', pain: 'Decisions exposed to volatility; limited scenarios.', solution: 'Simulate fleet economics under disruption scenarios to improve resilience and margin.' },
        { domain: 'Revenue &amp; Margin', workflow: 'RM1. Route Profitability with Disruption Costs', pain: 'Route margins distorted by unallocated costs.', solution: 'Attribute disruption costs to routes to reveal true profitability and improve network/fleet decisions.' },
        { domain: '', workflow: 'RM2. Margin Bridge: Plan vs. Actual', pain: 'Erosion identified late at aggregate level.', solution: 'Decompose margin moves into drivers to enable earlier corrective actions on revenue and cost.' },
        { domain: 'Cost Execution', workflow: 'CE1. Crew Accommodation Cost Reconciliation', pain: 'Manual matching of invoices vs. room-night files.', solution: 'Automate rate/date reconciliation to flag mismatches and reduce leakage.' },
        { domain: '', workflow: 'CE2. Direct Operating Cost OCR &amp; Posting', pain: 'OCR-heavy workflows with manual corrections.', solution: 'Extract, validate, and post DOC invoices directly into SAP/<span style=\\"font-style:normal\\"><span style=\\"font-weight:400\\">Skymetrix</span></span> to speed up close and improve accuracy.' },
        { domain: 'Working Capital', workflow: 'WC1. Headphones Inventory Flow Forecasting', pain: 'No reliable view of stock; reactive replenishment.', solution: 'Forecast consumption &amp; track outbound assets to reduce losses, emergency shipments, and excess.' },
        { domain: '', workflow: 'WC2. Asset Accountability &amp; Replenishment Logic', pain: 'Excess safety stock tied up due to uncertainty.', solution: 'Define demand-driven replenishment rules to optimize service levels while freeing working capital.' },
        { domain: 'Performance &amp; Governance', workflow: 'PG1. Cost &amp; Forecast Variance Control', pain: 'Variances explained manually and late.', solution: 'Automate variance attribution and flag recurring drivers to improve cost discipline and forecast governance.' },
        { domain: '', workflow: 'PG2. Contract &amp; Policy Compliance Monitoring', pain: 'Inconsistent application of contracts.', solution: 'Monitor compliance with hotel and transport contracts to reduce leakage and enforce controls.' },
        { domain: 'Decision Support', workflow: 'DS1. FP&amp;A and Finance Business Partner Copilot', pain: 'Time spent reconciling data instead of advising.', solution: 'Answer concrete questions (cost impact, deltas) instantly to increase velocity and finance leverage.' },
        { domain: '', workflow: 'DS2. Executive Steering Insights', pain: 'Reviews dominated by lagging indicators.', solution: 'Surface forward-looking risk and opportunity signals to enable proactive steering at ExCo level.' },
        { domain: 'Data Architecture', workflow: 'DA1. SAP-Centric Finance Data Layer', pain: 'Fragmented systems; high effort to connect data.', solution: 'Connect SAP with operational airline systems for a single source of truth for forecasting, costing, and reporting.' },
        { domain: '', workflow: 'DA2. Reusable Finance Data Products', pain: 'Use cases built from scratch; no compounding.', solution: 'Standardize finance data products (cost drivers, inventory) to compound value across all AI cases.' }
      ];

      // Replace each row's content if we have new data
      // CRITICAL: Apply hardTruncate as FINAL SAFETY NET to guarantee limits
      heatmap.rows.forEach((newRow, i) => {
        if (i < templateRows.length) {
          const tmpl = templateRows[i];
          // Replace workflow name (HARD LIMIT: 47 chars)
          if (tmpl.workflow && newRow.name) {
            const truncatedName = hardTruncate(newRow.name, LIMITS.heatmap.workflowName.max);
            edn = edn.split(tmpl.workflow).join(esc(truncatedName));
          }
          // Replace pain point (HARD LIMIT: 48 chars)
          if (tmpl.pain && newRow.painPoint) {
            const truncatedPain = hardTruncate(newRow.painPoint, LIMITS.heatmap.painPoint.max);
            edn = edn.split(tmpl.pain).join(esc(truncatedPain));
          }
          // Replace solution (HARD LIMIT: 114 chars)
          if (tmpl.solution && newRow.solution) {
            const truncatedSolution = hardTruncate(newRow.solution, LIMITS.heatmap.solutionImpact.max);
            edn = edn.split(tmpl.solution).join(esc(truncatedSolution));
          }
          // Replace domain (only if not empty in template)
          if (tmpl.domain && newRow.domain) {
            const truncatedDomain = hardTruncate(newRow.domain, LIMITS.heatmap.domainName.max);
            edn = edn.split(tmpl.domain).join(esc(truncatedDomain));
          }
        }
      });

      return edn;
    }

    // Generate EDN for angle card slide
    // CRITICAL: Only replace text content using simple string split/join
    // NEVER modify structure (UUIDs, coords, table-style, layout, etc.)
    // Template uses angle_cards_double_with_domains format with:
    // - Main title, domain headers, workflow IDs, subtitles
    // - 3 CHALLENGES, 5 SOLUTIONS, 3 IMPACT bullets per workflow
    function generateAngleCardEdn(card, cardIndex) {
      const { context } = state;
      let edn = getAngleCardEdnTemplate();

      if (!edn) {
        console.error('No angle card EDN template found');
        return '';
      }

      // 1. Replace main slide title
      // Template: "High-performing airlines steer volatility through margin transparency"
      const templateMainTitle = 'High-performing airlines steer volatility through margin transparency';
      edn = edn.split(templateMainTitle).join(esc(card.title || `AI Value Creation - ${context.industry}`));

      // 2. Replace subtitle line
      // Template: "AI Value Creation in Finance — Example High-ROI Agentic Workflows"
      const templateSubtitle = 'AI Value Creation in Finance — Example High-ROI Agentic Workflows';
      edn = edn.split(templateSubtitle).join(`AI Value Creation in ${esc(context.industry)} — High-ROI Agentic Workflows`);

      // 3. Augusta Labs footer - KEEP Augusta Labs branding (don't replace)

      // Define template patterns for left (workflow 0) and right (workflow 1) cards
      // These MUST match exactly what's in the canonical template
      // Note: Some bullets have span wrappers for letter-spacing - we handle both versions
      const templatePatterns = [
        {
          // Left card - Planning & Forecasting (from canonical template)
          domain: 'Planning &amp; Forecasting',
          // The workflow title uses a specific span structure - we replace the ID and name separately
          workflowIdPrefix: 'PF1.  ',
          workflowName: 'Integrated Rolling Forecast &amp; Ops Signals',
          subtitle: 'Stabilizing outlooks via continuous Ops-to-Finance loops.',
          challenges: [
            'Forecasts distorted by crew volatility, disruption costs, and unallocated events.',
            'Manual overrides on baseline data lack driver-level traceability or audit trails.',
            'Mid-cycle blind spots erode credibility of ExCo decisions and market guidance.'
          ],
          // Solutions - note index 1 has span wrapper in template
          solutions: [
            'Ingest live crew pairings, fleet maintenance, and disruption data into forecasting.',
            'Continuous ops-to-finance loop updates P&amp;L outlooks dynamically, replacing static cycles.',
            'Simulate P&amp;L impact of network disruptions to quantify downside risk and recovery paths.',
            'Automate variance analysis to isolate specific cost drivers like fuel vs. delay impact.',
            'Auto-adjust baselines using AI to free up FP&amp;A capacity for high-value strategic support.'
          ],
          // Solution at index 1 is wrapped: <span style="letter-spacing:-0.03em">...</span>
          solutionSpanWrappedIndex: 1,
          impacts: [
            '20–30% reduction in forecast error and P&amp;L volatility across volatile quarters.',
            '2x increase in outlook update frequency, boosting investor guidance credibility.',
            '5–10% reduction in unallocated disruption costs via earlier corrective action.'
          ],
          icon: 'track_changes'
        },
        {
          // Right card - Revenue & Margin (from canonical template)
          domain: 'Revenue &amp; Margin',
          workflowIdPrefix: 'RM2.  ',
          workflowName: 'Margin Bridge: Plan vs. Actual',
          subtitle: 'Decomposing variance drivers to explain margin movement.',
          challenges: [
            'Margin erosion often identified too late and only at aggregate route or region level.',
            'Disruption and crew costs blended into broad variances, hiding operational root causes.',
            'FP&amp;A teams spend days manually rebuilding variance explanations for monthly reviews.'
          ],
          // Solutions - note index 0 has span wrapper in template
          solutions: [
            'Automated margin bridges decompose variance into granular rate, volume, and cost drivers.',
            'ML attributes deviations to specific events like ATC delays or unbudgeted crew swaps.',
            'Standardize bridge logic across all forecasts and MBRs to ensure a single truth source.',
            'Isolate structural vs. temporary cost spikes to inform long-term network pricing strategy.',
            'Instant drill-down from network-level margin gaps to specific flight-level cost events.'
          ],
          // Solution at index 0 is wrapped: <span style="letter-spacing:-0.03em">...</span>
          solutionSpanWrappedIndex: 0,
          impacts: [
            'Reduce time-to-insight for monthly variance analysis and MBR preparation by 40–60%.',
            'Detect structural margin erosion 2–3 months earlier than standard aggregate reporting.',
            'Eliminate manual reconciliation effort, shifting Finance focus to strategic mitigation.'
          ],
          icon: 'analytics'
        }
      ];

      // Replace content for each workflow (up to 2 per card)
      card.workflows.forEach((workflow, wi) => {
        if (wi >= templatePatterns.length) return;
        const pattern = templatePatterns[wi];

        // Replace domain header
        if (workflow.domain) {
          edn = edn.split(pattern.domain).join(esc(workflow.domain));
        }

        // Replace workflow ID prefix (e.g., "PF1.  " -> "XX1.  ")
        if (workflow.id) {
          edn = edn.split(pattern.workflowIdPrefix).join(esc(workflow.id) + '  ');
        }

        // Replace workflow name
        if (workflow.name) {
          edn = edn.split(pattern.workflowName).join(esc(workflow.name));
        }

        // Replace subtitle
        if (workflow.subtitle) {
          edn = edn.split(pattern.subtitle).join(esc(workflow.subtitle));
        }

        // Replace challenges (individual bullets - ENFORCE 85 char limit)
        if (workflow.challenges && workflow.challenges.length > 0) {
          pattern.challenges.forEach((oldChallenge, ci) => {
            if (workflow.challenges[ci]) {
              const enforced = enforceBulletMax(workflow.challenges[ci], 85);
              edn = edn.split(oldChallenge).join(esc(enforced));
            }
          });
        }

        // Replace solutions (individual bullets - ENFORCE 85 char limit)
        // Note: Some solutions in template are wrapped in <span style="letter-spacing:-0.03em">
        if (workflow.solutions && workflow.solutions.length > 0) {
          pattern.solutions.forEach((oldSolution, si) => {
            if (workflow.solutions[si]) {
              const enforced = enforceBulletMax(workflow.solutions[si], 85);
              const newSolution = esc(enforced);
              // If this is the span-wrapped bullet, we need to replace just the inner text
              if (si === pattern.solutionSpanWrappedIndex) {
                // Replace the span-wrapped version (preserving the span wrapper)
                const wrappedOld = `<span style="letter-spacing:-0.03em">${oldSolution}</span>`;
                edn = edn.split(wrappedOld).join(`<span style="letter-spacing:-0.03em">${newSolution}</span>`);
              } else {
                // Simple text replacement for non-wrapped bullets
                edn = edn.split(oldSolution).join(newSolution);
              }
            }
          });
        }

        // Replace impacts (individual bullets - ENFORCE 85 char limit)
        if (workflow.impacts && workflow.impacts.length > 0) {
          pattern.impacts.forEach((oldImpact, ii) => {
            if (workflow.impacts[ii]) {
              const enforced = enforceBulletMax(workflow.impacts[ii], 85);
              edn = edn.split(oldImpact).join(esc(enforced));
            }
          });
        }

        // Replace icon if specified (just the icon name, not the full path)
        if (workflow.icon) {
          edn = edn.split(`Material-Outlined/${pattern.icon}.svg`).join(`Material-Outlined/${workflow.icon}.svg`);
        }
      });

      return edn;
    }

      const allSlides = [

      ];

          title: card.title || `Angle Card ${i + 1}`,
          workflows: card.workflows.map(w => w.id).join(' + '),
          edn: angleCardEdns[i]
        });
      });

      return {
        heatmapEdn: heatmapEdn,
        angleCardEdns: angleCardEdns,
        allSlides: allSlides,

        input.value = '';
        processCustomContext(text);
        return;
      }

      // Handle free-form feedback at any phase (especially during heatmap/selection stages)
      if (state.phase >= 2 && text) {
        input.value = '';
        handleFreeformFeedback(text);
        return;
      }

      if (!text && !questions[state.currentQuestion]?.optional) return;

      handleAnswer(text || '(skipped)');
      input.value = '';
    }

    function handleFreeformFeedback(feedback) {
      // Store the feedback
      state.freeformFeedback.push({
        phase: state.phase,
        timestamp: new Date().toISOString(),
        message: feedback
      });

      // Show user message
      addMessage(feedback, true);

      // Parse the feedback to understand what needs to change
      const feedbackLower = feedback.toLowerCase();

      // Check if user wants to regenerate/change something
      if (state.phase === 2 && state.heatmap) {
        // User is on heatmap phase - apply changes and regenerate
        setTimeout(() => {
          applyFeedbackAndRegenerate(feedback);
        }, 300);
      } else if (state.phase === 3) {
        // User is on selection phase
        setTimeout(() => {
          applySelectionFeedback(feedback);
        }, 300);
      } else if (state.phase === 4 && state.waitingForAngleCardFeedback) {
        // User is on angle cards phase - apply feedback to current card
        setTimeout(() => {
          applyAngleCardFeedbackFromInput(feedback);
        }, 300);
      }

    function applyFeedbackAndRegenerate(feedback) {
      const feedbackLower = feedback.toLowerCase();

      // Show processing message
      addMessage(`
        <div class="loading">
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
          <span>Applying changes and regenerating...</span>
        </div>
      `);

      setTimeout(() => {
        // Remove loading message
        const messages = document.getElementById('messages');
        messages.lastChild.remove();

        // Parse feedback to understand changes
        let changesApplied = [];

        // Check for domain/workflow removal requests
        const removePatterns = [
          /don'?t like\s+(.+)/i,
          /remove\s+(.+)/i,
          /delete\s+(.+)/i,
          /exclude\s+(.+)/i
        ];

        // Check for addition requests - more specific patterns
        const addPatterns = [
          /add\s+(?:one\s+)?(?:more\s+)?(?:another\s+)?(?:new\s+)?(?:roi\s+)?workflow[s]?\s+(?:for\s+)?(.+)/i,
          /(?:one\s+)?more\s+(?:roi\s+)?workflow[s]?\s+(?:for\s+)?(.+)/i,
          /another\s+(?:roi\s+)?workflow[s]?\s+(?:for\s+)?(.+)/i,
          /include\s+(.+)/i,
          /add\s+(.+)/i
        ];

        // Apply domain/workflow filtering
        if (state.heatmap && state.heatmap.rows) {
          // Find keywords to exclude
          const excludeKeywords = [];
          removePatterns.forEach(pattern => {
            const match = feedbackLower.match(pattern);
            if (match && match[1]) {
              const words = match[1].split(/\s+/).filter(w => w.length > 2 && !['workflow', 'workflows', 'another', 'more'].includes(w));
              excludeKeywords.push(...words);
            }
          });

          // Filter out rows that match exclude keywords
          if (excludeKeywords.length > 0) {
            const originalCount = state.heatmap.rows.length;
            state.heatmap.rows = state.heatmap.rows.filter(row => {
              const rowText = `${row.domain} ${row.name} ${row.painPoint} ${row.solution}`.toLowerCase();
              return !excludeKeywords.some(kw => rowText.includes(kw));
            });
            const removedCount = originalCount - state.heatmap.rows.length;
            if (removedCount > 0) {
              changesApplied.push(`Removed ${removedCount} workflow(s) matching: ${excludeKeywords.join(', ')}`);
            }
          }

          // Check for ADD requests
          let addMatch = null;
          for (const pattern of addPatterns) {
            addMatch = feedbackLower.match(pattern);
            if (addMatch) break;
          }

          if (addMatch || feedbackLower.includes('add') || feedbackLower.includes('more') || feedbackLower.includes('another')) {
            // Find which domain(s) to add to
            const targetDomains = [];
            const allDomains = DOMAINS[state.context.version] || [];

            // Check feedback for specific domain keywords - only add to explicitly mentioned domains
            if (feedbackLower.includes('planning') || feedbackLower.includes('forecast')) {
              const pf = allDomains.find(d => d.name.toLowerCase().includes('planning') || d.name.toLowerCase().includes('forecast'));
              if (pf) targetDomains.push(pf);
            }
            if (feedbackLower.includes('capital') || feedbackLower.includes('allocation')) {
              const ca = allDomains.find(d => d.name.toLowerCase().includes('capital'));
              if (ca) targetDomains.push(ca);
            }
            if (feedbackLower.includes('revenue') && !feedbackLower.includes('planning')) {
              const rm = allDomains.find(d => d.name.toLowerCase().includes('revenue'));
              if (rm) targetDomains.push(rm);
            }
            if (feedbackLower.includes('margin') && !feedbackLower.includes('planning')) {
              const rm = allDomains.find(d => d.name.toLowerCase().includes('margin'));
              if (rm) targetDomains.push(rm);
            }
            if (feedbackLower.includes('cost') || feedbackLower.includes('execution')) {
              const ce = allDomains.find(d => d.name.toLowerCase().includes('cost') || d.name.toLowerCase().includes('execution'));
              if (ce) targetDomains.push(ce);
            }
            if (feedbackLower.includes('working') || feedbackLower.includes('inventory')) {
              const wc = allDomains.find(d => d.name.toLowerCase().includes('working'));
              if (wc) targetDomains.push(wc);
            }
            if (feedbackLower.includes('performance') || feedbackLower.includes('governance')) {
              const pg = allDomains.find(d => d.name.toLowerCase().includes('performance') || d.name.toLowerCase().includes('governance'));
              if (pg) targetDomains.push(pg);
            }
            if (feedbackLower.includes('decision') || feedbackLower.includes('support') || feedbackLower.includes('copilot')) {
              const ds = allDomains.find(d => d.name.toLowerCase().includes('decision') || d.name.toLowerCase().includes('support'));
              if (ds) targetDomains.push(ds);
            }
            if (feedbackLower.includes('data') || feedbackLower.includes('architecture')) {
              const da = allDomains.find(d => d.name.toLowerCase().includes('data') || d.name.toLowerCase().includes('architecture'));
              if (da) targetDomains.push(da);
            }

            // If still no specific domain found, check for general domain name matches
            if (targetDomains.length === 0) {
              allDomains.forEach(domain => {
                const domainWords = domain.name.toLowerCase().split(/\s+/);
                if (domainWords.some(w => w.length > 3 && feedbackLower.includes(w))) {
                  targetDomains.push(domain);
                }
              });
            }

            // Add new workflows to target domains - INSERT into existing domain group, not at end
            if (targetDomains.length > 0) {
              targetDomains.forEach(domain => {
                const existingForDomain = state.heatmap.rows.filter(r => r.domain === domain.name);
                const newWorkflowNum = existingForDomain.length + 1;
                const newId = `${domain.abbr}${newWorkflowNum}`;

                const newWorkflow = {
                  id: newId,
                  domain: domain.name,
                  name: `${newId}. ${generateContextAwareWorkflowName(domain.name, newWorkflowNum)}`,
                  painPoint: generateContextAwarePainPoint(domain.name),
                  solution: generateContextAwareSolution(domain.name),
                  hasCheckmark: false,
                  isAlternative: true
                };

                // Find the index of the last workflow in this domain group
                let lastDomainIndex = -1;
                for (let i = 0; i < state.heatmap.rows.length; i++) {
                  if (state.heatmap.rows[i].domain === domain.name) {
                    lastDomainIndex = i;
                  }
                }

                // Insert right after the last workflow in the domain group
                if (lastDomainIndex >= 0) {
                  state.heatmap.rows.splice(lastDomainIndex + 1, 0, newWorkflow);
                } else {
                  // Domain not found, add to end (shouldn't happen)
                  state.heatmap.rows.push(newWorkflow);
                }

                // Also add to allRows for selection (at the same position)
                if (state.heatmap.allRows) {
                  let lastAllRowsIndex = -1;
                  for (let i = 0; i < state.heatmap.allRows.length; i++) {
                    if (state.heatmap.allRows[i].domain === domain.name) {
                      lastAllRowsIndex = i;
                    }
                  }
                  if (lastAllRowsIndex >= 0) {
                    state.heatmap.allRows.splice(lastAllRowsIndex + 1, 0, newWorkflow);
                  } else {
                    state.heatmap.allRows.push(newWorkflow);
                  }
                }
                changesApplied.push(`Added new workflow: ${newWorkflow.name}`);
              });
            }
          }

          // Generate new titles if heatmap changed
          if (changesApplied.length > 0) {
            state.heatmap.titles = [
              `${state.context.industry} P&L impact comes from focused AI deployment on high-value workflows`,
              `${state.context.company} value creation accelerates through targeted automation`,
              `Strategic workflow selection drives sustainable margin improvement`,
              `${state.context.industry} leaders differentiate through disciplined AI prioritization`,
              `Sustainable P&L gains emerge from iterative AI workflow refinement`
            ];
          }
        }

        // Display updated heatmap
        if (changesApplied.length > 0) {
          const changesSummary = `
            <h3>Changes Applied</h3>
            <ul style="margin-left: 20px; margin-top: 8px;">
              ${changesApplied.map(c => `<li>${c}</li>`).join('')}
            </ul>
            <p style="margin-top: 12px; color: #60a5fa;">Here's the updated heatmap:</p>
          `;
          addMessage(changesSummary);
        } else {
          addMessage(`
            <p>I've noted your feedback. Here's the regenerated heatmap with variations:</p>
          `);
          // Shuffle/regenerate some content
          shuffleHeatmapContent();
        }

        // Re-display the heatmap (don't remove loading since we already did)
        setTimeout(() => {
          displayHeatmap(false);
        }, 300);

      }, 1000);
    }

    async function generateHeatmap() {
      updatePhase(2);

      addMessage(`
        <div class="loading">
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
          <span>Generating P&L heatmap with GPT-5.2...</span>
        </div>
      `);

      // Use selected domains if available (Version 2/3), otherwise use all domains
      const domains = state.context.selectedDomains || DOMAINS[state.context.version];

      // Check if API is available
      let useAI = false;
      try {
        const statusRes = await fetch('/api/status');
        const status = await statusRes.json();
        useAI = status.openaiConfigured;
      } catch (e) {
        console.log('API not available, using fallback templates');
      }

      if (useAI) {
        try {
          const response = await fetch('/api/generate-heatmap', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              context: state.context,
              domains: domains
            })
          });

          const result = await response.json();

          if (result.success && result.data) {
            const aiData = result.data;
            const painPointMentions = state.context.painPoints.map(p => p.toLowerCase());

            // Build heatmap from AI response with HARD TRUNCATION
            // Store name WITHOUT ID prefix - ID is stored separately
            const rows = aiData.workflows.map(w => ({
              id: w.id,
              domain: hardTruncate(w.domain, LIMITS.heatmap.domainName.max),
              name: hardTruncate(w.name.replace(/^[A-Z]{1,3}\d+\.\s*/i, ''), LIMITS.heatmap.workflowName.max), // Strip ID prefix if present
              painPoint: hardTruncate(w.painPoint, LIMITS.heatmap.painPoint.max),
              solution: hardTruncate(w.solution, LIMITS.heatmap.solutionImpact.max),
              hasCheckmark: painPointMentions.some(p =>
                w.name.toLowerCase().includes(p) ||
                p.includes(w.domain.toLowerCase().split(' ')[0])
              ),
              isCustom: false
            }));

            // Now generate titles via AI
            const titlesResponse = await fetch('/api/generate-titles', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                context: state.context,
                workflowCount: rows.length
              })
            });

            const titlesResult = await titlesResponse.json();
            const rawTitles = titlesResult.success && titlesResult.data?.titles
              ? titlesResult.data.titles
              : generateFallbackTitles();
            // HARD TRUNCATE all titles
            const titles = rawTitles.map(t => hardTruncate(t, LIMITS.heatmap.slideTitle.max));

            state.heatmap = {
              titles: titles,
              selectedTitle: null,
              rows: rows,
              allRows: [...rows],
              bottomBoxes: generateBottomBoxes(),
              footer: state.context.painPoints.length > 0
                ? `Case Mentioned in Introduction Call by ${state.context.audience.name} (${state.context.audience.title})`
                : null
            };
          } else {
            console.error('API error:', result.error);
            state.heatmap = generateMockHeatmap(domains);
          }
        } catch (error) {
          console.error('Error generating heatmap:', error);
          state.heatmap = generateMockHeatmap(domains);
        }
      } else {
        // Fallback to template-based generation
        state.heatmap = generateMockHeatmap(domains);
      }

      displayHeatmap();
    }

    async function generateAngleCards() {
      updatePhase(4);

      addMessage(`
        <div class="loading">
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
          <span>Generating Angle Cards with AI...</span>
        </div>
      `);

      // Determine grouping strategy based on count and suggestions
      const workflows = state.selectedWorkflows;
      const suggestions = (state.groupingSuggestions || '').toLowerCase();
      const groups = [];

      // Check if user wants groups of 3
      const wantsThrees = suggestions.includes('3') || suggestions.includes('three') || suggestions.includes('triple');

      if (wantsThrees && workflows.length >= 3) {
        // Group by 3s, with remainder as smaller group
        for (let i = 0; i < workflows.length; i += 3) {
          const group = workflows.slice(i, Math.min(i + 3, workflows.length));
          if (group.length > 0) groups.push(group);
        }
      } else {
        // Default: group by 2s, with last group of 3 if odd number
        const count = workflows.length;
        if (count % 2 === 1 && count >= 3) {
          // Odd number: make last group a triple
          for (let i = 0; i < count - 3; i += 2) {
            groups.push([workflows[i], workflows[i + 1]]);
          }
          groups.push([workflows[count - 3], workflows[count - 2], workflows[count - 1]]);
        } else {
          // Even number: all pairs
          for (let i = 0; i < count; i += 2) {
            if (workflows[i + 1]) {
              groups.push([workflows[i], workflows[i + 1]]);
            } else {
              groups.push([workflows[i]]); // Single item if somehow odd
            }
          }
        }
      }

      // Check if API is available
      let useAI = false;
      try {
        const statusRes = await fetch('/api/status');
        const status = await statusRes.json();
        useAI = status.openaiConfigured;
      } catch (e) {
        console.log('API not available, using fallback templates');
      }

      if (useAI) {
        // Generate each card via OpenAI API
        state.angleCards = [];
        for (let i = 0; i < groups.length; i++) {
          const group = groups[i];
          try {
            // Update loading message
            const messages = document.getElementById('messages');
            const loadingMsg = messages.lastChild?.querySelector('.loading span');
            if (loadingMsg) {
              loadingMsg.textContent = `Generating Card ${i + 1} of ${groups.length} with GPT-5.2...`;
            }

            const response = await fetch('/api/generate-angle-card', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                context: state.context,
                workflows: group,
                cardIndex: i,
                totalCards: groups.length
              })
            });

            const result = await response.json();

            if (result.success && result.data) {
              const aiData = result.data;
              state.angleCards.push({
                workflows: group.map((w, wi) => {
                  const aiWorkflow = aiData.workflows?.[wi] || {};
                  return {
                    ...w,
                    subtitle: aiWorkflow.subtitle || generateWorkflowSubtitle(w),
                    challenges: aiWorkflow.challenges || generateChallenges(w),
                    solutions: aiWorkflow.solutions || generateSolutions(w),
                    impacts: aiWorkflow.impacts || generateImpacts(w)
                  };
                }),
                title: aiData.title || generateFallbackTitle(group),
                approved: false
              });
            } else {
              console.error('API error:', result.error);
              state.angleCards.push(generateFallbackCard(group));
            }
          } catch (error) {
            console.error('Error generating card', i, error);
            state.angleCards.push(generateFallbackCard(group));
          }
        }
      } else {
        // Fallback: use template-based generation
        state.angleCards = groups.map(group => generateFallbackCard(group));
      }

      // Start reviewing cards one by one
      state.currentAngleCardIndex = 0;
      displayCurrentAngleCard();
    }

    function generateFallbackTitle(group) {
      const domains = [...new Set(group.map(w => w.domain.toLowerCase()))];
      const domainText = domains.length === 1
        ? domains[0]
        : domains.slice(0, -1).join(', ') + ' and ' + domains[domains.length - 1];
      return `High-performing ${state.context.industry.toLowerCase()} organizations excel through ${domainText} integration`;
    }

    function generateFallbackCard(group) {
      return {
        workflows: group.map(w => ({
          ...w,
          subtitle: generateWorkflowSubtitle(w),
          challenges: generateChallenges(w),
          solutions: generateSolutions(w),
          impacts: generateImpacts(w)
        })),
        title: generateFallbackTitle(group),
        approved: false
      };
    }

    // Version counter for truly random regeneration
    let contentVersion = 0;

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function shuffleAndPick(arr, count) {
      const shuffled = [...arr].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, count);
    }

    function generateWorkflowSubtitle(workflow) {
      const { company, industry, audience } = state.context;
      const domain = workflow.domain.toLowerCase();
      const audienceRole = audience.title.toLowerCase();

      const templates = [
        `Automating ${domain} to address ${audience.name}'s focus on ${audience.concerns.toLowerCase()}.`,
        `Building intelligent ${domain} capabilities for ${industry} leaders.`,
        `Transforming ${domain} through AI-driven insights that matter to ${audienceRole}s.`,
        `Enabling real-time ${domain} optimization at ${company}.`,
        `Streamlining ${domain} workflows to drive ${audience.concerns.toLowerCase()}.`,
        `Accelerating ${domain} decisions with AI—aligned to ${audience.name}'s priorities.`,
        `Empowering ${industry} ${domain} with intelligent automation.`,
        `Delivering ${domain} intelligence tailored for ${audienceRole} visibility.`
      ];
      return pickRandom(templates);
    }

    function generateChallenges(workflow) {
      const { company, industry, audience } = state.context;
      const domain = workflow.domain.toLowerCase();

      // STRICT: Each bullet MUST be 70-85 chars - these are pre-measured templates
      const challengePool = [
        `Manual entry and reconciliation across fragmented systems drives delays and accuracy gaps.`, // 84
        `Limited visibility into operational drivers during close cycles delays executive reporting.`, // 85
        `Fragmented data sources and inconsistent metric definitions complicate decision-making.`, // 83
        `Legacy processes consume analyst capacity on low-value reconciliation instead of insights.`, // 85
        `Inconsistent data validation rules and missing controls undermine reporting reliability.`, // 84
        `Cross-functional handoffs and manual workflows introduce systematic delays and errors.`, // 82
        `Siloed systems prevent real-time insight into operational status and emerging risk signals.`, // 85
        `Static reporting cycles miss dynamic changes that impact forecasts and strategic decisions.`, // 85
        `Lack of automated exception handling increases manual effort and extends processing time.`, // 84
        `Disconnected workflows create blind spots that erode forecast accuracy and control.` // 78
      ];

      // Enforce 85 char max strictly
      return shuffleAndPick(challengePool, 3).map(enforceBulletMax);
    }

    // Helper to enforce 85 char max - truncate at word boundary
    function enforceBulletMax(text, max = 85) {
      if (!text) return text;
      text = text.trim();
      if (text.length <= max) return text;
      // Leave room for period
      let cut = text.lastIndexOf(' ', max - 2);
      if (cut < 50) cut = max - 2;
      let result = text.substring(0, cut).trim();
      if (!/[.!?]$/.test(result)) result += '.';
      // HARD truncate if still over - this guarantees <= max
      if (result.length > max) {
        result = result.substring(0, max - 1) + '.';
      }
      return result;
    }

        `Reduce manual touchpoints from 10+ to 2-3 via end-to-end workflow orchestration.`, // 79

    function applyAngleCardFeedbackFromInput(feedback) {
      const card = state.angleCards[state.currentAngleCardIndex];
      const feedbackLower = feedback.toLowerCase();
      const { company, industry, audience } = state.context;

      // Store freeform feedback for context
      if (!state.freeformFeedback) state.freeformFeedback = [];
      state.freeformFeedback.push({
        cardIndex: state.currentAngleCardIndex,
        feedback: feedback,
        timestamp: new Date().toISOString()
      });

      let appliedChanges = [];

      // Check if user wants to modify specific text by providing new text
      // Pattern: "change X to Y" or "replace X with Y" or "make it say Y"
      const changeMatch = feedback.match(/(?:change|replace|make it say|update to|set to|use)[:\s]+["']?(.+?)["']?\s*(?:to|with|instead)[:\s]+["']?(.+?)["']?$/i);
      if (changeMatch) {
        const oldText = changeMatch[1].trim();
        const newText = changeMatch[2].trim();

        // Try to find and replace in challenges, solutions, impacts
        card.workflows.forEach(w => {
          w.challenges = w.challenges.map(c =>
            c.toLowerCase().includes(oldText.toLowerCase()) ? newText : c
          );
          w.solutions = w.solutions.map(s =>
            s.toLowerCase().includes(oldText.toLowerCase()) ? newText : s
          );
          w.impacts = w.impacts.map(i =>
            i.toLowerCase().includes(oldText.toLowerCase()) ? newText : i
          );
        });
        appliedChanges.push(`Replaced text containing "${oldText}"`);
      }

      // Pattern: Add specific content - "add challenge: X" or "add to challenges: X"
      const addMatch = feedback.match(/add\s+(?:to\s+)?(challenge|solution|impact|subtitle)[s]?[:\s]+["']?(.+?)["']?$/i);
      if (addMatch) {
        const section = addMatch[1].toLowerCase();
        const newContent = addMatch[2].trim();

        card.workflows.forEach(w => {
          if (section === 'challenge') {
            w.challenges.push(newContent);
          } else if (section === 'solution') {
            w.solutions.push(newContent);
          } else if (section === 'impact') {
            w.impacts.push(newContent);
          } else if (section === 'subtitle') {
            w.subtitle = newContent;
          }
        });
        appliedChanges.push(`Added ${section}: "${newContent}"`);
      }

      // Pattern: Remove specific content - "remove the bullet about X"
      const removeMatch = feedback.match(/(?:remove|delete|drop)\s+(?:the\s+)?(?:bullet\s+)?(?:about\s+)?["']?(.+?)["']?$/i);
      if (removeMatch) {
        const textToRemove = removeMatch[1].trim().toLowerCase();

        card.workflows.forEach(w => {
          w.challenges = w.challenges.filter(c => !c.toLowerCase().includes(textToRemove));
          w.solutions = w.solutions.filter(s => !s.toLowerCase().includes(textToRemove));
          w.impacts = w.impacts.filter(i => !i.toLowerCase().includes(textToRemove));
        });
        appliedChanges.push(`Removed bullets mentioning "${textToRemove}"`);
      }

      // Pattern: Focus on specific topic - "focus more on efficiency" or "emphasize cost savings"
      const focusMatch = feedback.match(/(?:focus|emphasize|highlight|stress)\s+(?:more\s+)?(?:on\s+)?["']?(.+?)["']?$/i);
      if (focusMatch) {
        const focusTopic = focusMatch[1].trim();

        card.workflows.forEach(w => {
          // Add a new challenge and impact related to the focus topic
          w.challenges.push(`${focusTopic.charAt(0).toUpperCase() + focusTopic.slice(1)} gaps impacting ${audience.name}'s ${audience.concerns.toLowerCase()} objectives.`);
          w.impacts.push(`Drive measurable ${focusTopic} improvements aligned to ${company}'s strategic goals.`);
        });
        appliedChanges.push(`Added emphasis on "${focusTopic}"`);
      }

      // Pattern: Mention specific person/role - "mention the CFO" or "reference João's concerns"
      const mentionMatch = feedback.match(/(?:mention|reference|include|add)\s+(?:the\s+)?(\w+(?:'s)?)\s*(?:concerns?|priorities|focus|needs)?/i);
      if (mentionMatch && !addMatch && !focusMatch) {
        const personOrRole = mentionMatch[1].replace(/'s$/, '');

        card.workflows.forEach(w => {
          w.challenges.push(`Addressing ${personOrRole}'s key concerns about operational visibility and control.`);
          w.solutions.push(`Provide ${personOrRole} with real-time dashboards and actionable insights.`);
        });
        appliedChanges.push(`Added reference to "${personOrRole}"`);
      }

      // Pattern: Make it more X - "make it more specific" or "make it shorter"
      const styleMatch = feedback.match(/(?:make\s+it|be)\s+(?:more\s+)?(\w+)/i);
      if (styleMatch && !changeMatch) {
        const style = styleMatch[1].toLowerCase();

        if (style === 'specific' || style === 'concrete') {
          // Replace generic statements with more specific ones
          card.workflows.forEach(w => {
            w.impacts = w.impacts.map(i =>
              i.replace(/improve/gi, 'achieve 25-30% improvement in')
                .replace(/reduce/gi, 'cut by 40-60%')
                .replace(/faster/gi, '2-3x faster')
            );
          });
          appliedChanges.push('Made impacts more specific with concrete numbers');
        } else if (style === 'shorter' || style === 'concise') {
          card.workflows.forEach(w => {
            w.challenges = w.challenges.slice(0, 2);
            w.solutions = w.solutions.slice(0, 3);
            w.impacts = w.impacts.slice(0, 2);
          });
          appliedChanges.push('Shortened content to key points');
        } else if (style === 'technical') {
          card.workflows.forEach(w => {
            w.solutions.push(`Leverage ML models trained on ${industry.toLowerCase()}-specific data patterns.`);
            w.solutions.push(`API-first architecture enables seamless integration with existing ERP systems.`);
          });
          appliedChanges.push('Added technical details');
        }
      }

      // If user changes title directly
      if (feedbackLower.includes('title:') || feedbackLower.includes('heading:')) {
        const titleMatch = feedback.match(/(?:title|heading)[:\s]+["']?(.+?)["']?$/i);
        if (titleMatch) {
          card.title = titleMatch[1].trim();
          appliedChanges.push(`Updated title to: "${card.title}"`);
        }
      }

      // Fallback: If no specific pattern matched, regenerate with context awareness
      if (appliedChanges.length === 0) {
        contentVersion++;

        // Parse feedback for context hints and regenerate with those in mind
        const feedbackContext = {
          mentionsEfficiency: feedbackLower.includes('efficien'),
          mentionsCost: feedbackLower.includes('cost') || feedbackLower.includes('saving'),
          mentionsSpeed: feedbackLower.includes('speed') || feedbackLower.includes('fast') || feedbackLower.includes('quick'),
          mentionsQuality: feedbackLower.includes('quality') || feedbackLower.includes('accuracy'),
          mentionsAudience: feedbackLower.includes(audience.name.toLowerCase()) || feedbackLower.includes(audience.title.toLowerCase())
        };

        card.workflows = card.workflows.map(w => {
          const newWorkflow = {
            ...w,
            subtitle: generateWorkflowSubtitle(w),
            challenges: generateChallenges(w),
            solutions: generateSolutions(w),
            impacts: generateImpacts(w)
          };

          // Add context-specific content based on feedback
          if (feedbackContext.mentionsEfficiency) {
            newWorkflow.impacts.push(`Boost operational efficiency by 35-50% through intelligent automation.`);
          }
          if (feedbackContext.mentionsCost) {
            newWorkflow.impacts.push(`Reduce ${w.domain.toLowerCase()} costs by $2-5M annually.`);
          }

    function getCharCountClass(length, min, max) {
      if (length > max) return 'error';
      if (length < min) return 'too-short';
      if (length >= min && length <= max) return 'good';
      return '';
    }

    // Enforce 70-85 character limit on bullets
    // Returns adjusted bullet or null if can't be fixed
    function enforceBulletLimit(bullet, min = 70, max = 85) {
      if (!bullet) return null;

      let text = bullet.trim();

      // If already in range, return as-is
      if (text.length >= min && text.length <= max) {
        return text;
      }

      // If too long, truncate smartly (at word boundary)
      if (text.length > max) {
        // Try to cut at last space before max
        let cutPoint = text.lastIndexOf(' ', max - 3);
        if (cutPoint > min) {
          text = text.substring(0, cutPoint) + '...';
        } else {
          text = text.substring(0, max - 3) + '...';
        }
      }

      // If too short, we can't automatically fix - return with warning
      // The generator templates should already produce 70-85 char bullets
      if (text.length < min) {
        console.warn(`Bullet too short (${text.length}): ${text}`);
      }

      return text;
    }

        w.challenges.forEach((c, i) => {
          if (c.length < MIN) issues.push(`Workflow ${wIdx + 1} Challenge ${i + 1}: too short (${c.length} chars)`);
          if (c.length > MAX) issues.push(`Workflow ${wIdx + 1} Challenge ${i + 1}: too long (${c.length} chars)`);
        });
        w.solutions.forEach((s, i) => {
          if (s.length < MIN) issues.push(`Workflow ${wIdx + 1} Solution ${i + 1}: too short (${s.length} chars)`);
          if (s.length > MAX) issues.push(`Workflow ${wIdx + 1} Solution ${i + 1}: too long (${s.length} chars)`);
        });
        w.impacts.forEach((imp, i) => {
          if (imp.length < MIN) issues.push(`Workflow ${wIdx + 1} Impact ${i + 1}: too short (${imp.length} chars)`);
          if (imp.length > MAX) issues.push(`Workflow ${wIdx + 1} Impact ${i + 1}: too long (${imp.length} chars)`);
        });
      });

      return issues;
